# Source of the KPI catalogue (docs/KPI_V2_TREE.md and docs/pt/KPI_V2_TREE.md).
# Every name evaluate_v2() emits must match exactly one entry; tests/test_kpi_catalogue.py checks this.
# After editing, run: python scripts/docs/kpi_catalogue.py
- id: cost
  title:
    en: Cost
    pt: Custo
  intro:
    en: Electricity cost of each member and of the district over the evaluated episode; the rows appear in every
      run.
    pt: Custo da eletricidade de cada membro e do distrito ao longo do episódio avaliado; as linhas aparecem em
      todas as execuções.
  kpis:
  - names: cost_{total,daily_average}_{control,baseline,delta}_eur
    levels:
    - building
    - district
    unit: EUR
    en: Electricity cost of the controlled run (`control`), of the conventional counterfactual (`baseline`) and
      control minus baseline (`delta`), as an episode total or a daily average.
    pt: Custo da eletricidade da execução controlada (`control`), do contrafactual convencional (`baseline`) e controlo
      menos contrafactual (`delta`), como total do episódio ou média diária.
  - names: cost_ratio_to_baseline_total_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Signed ratio of the control cost total to the baseline cost total; it stays lower-is-better when the totals
      are negative.
    pt: Rácio com sinal entre o custo total do controlo e o do contrafactual; continua a ser «menor é melhor» quando
      os totais são negativos.
  - names: cost_{total,daily_average}_{business_as_usual,delta_to_business_as_usual}_eur
    levels:
    - building
    - district
    unit: EUR
    en: Electricity cost; `_business_as_usual` and `_delta_to_business_as_usual` as in the shared rules.
    pt: Custo da eletricidade; `_business_as_usual` e `_delta_to_business_as_usual` como nas regras comuns.
  - names: cost_ratio_to_business_as_usual_total_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Signed ratio of the control cost total to the BAU cost total.
    pt: Rácio com sinal entre o custo total do controlo e o custo total BAU.
- id: energy_grid
  title:
    en: Grid energy and load shape
    pt: Energia da rede e forma da carga
  intro:
    en: Energy exchanged with the grid by each member and by the district, and the shape of the district load (peaks,
      ramping, load factor); the rows appear in every run, the shape rows at district level only.
    pt: Energia trocada com a rede por cada membro e pelo distrito, e a forma da carga do distrito (picos, rampas,
      fator de carga); as linhas aparecem em todas as execuções, as de forma só ao nível do distrito.
  kpis:
  - names: energy_grid_{total,daily_average}_{import,export,net_exchange}_{control,baseline,delta}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Grid import Σ max(net, 0), export Σ max(−net, 0) and signed net exchange Σ net of the controlled run, of
      the conventional counterfactual and control minus baseline; the district nets its members at each step.
    pt: Importação Σ max(net, 0), exportação Σ max(−net, 0) e troca líquida com sinal Σ net da execução controlada,
      do contrafactual convencional e controlo menos contrafactual; o distrito compensa os membros em cada passo.
  - names: energy_grid_{total,daily_average}_{import,export,net_exchange}_{business_as_usual,delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Grid import, export and net exchange; `_business_as_usual` and `_delta_to_business_as_usual` as in the shared
      rules.
    pt: Importação, exportação e troca líquida com a rede; `_business_as_usual` e `_delta_to_business_as_usual`
      como nas regras comuns.
  - names: energy_grid_ratio_to_baseline_{import,export,net_exchange}_total_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Control total over baseline total; signed ratio for net exchange. The district ratio divides the district
      totals.
    pt: Total do controlo sobre o total do contrafactual; rácio com sinal para a troca líquida. O rácio do distrito
      divide os totais do distrito.
  - names: energy_grid_ratio_to_baseline_{import,net_exchange}_total_building_mean_ratio
    levels:
    - district
    unit: ratio
    en: '3.6.0 definition kept for comparison: the unweighted mean of the building ratios, not a district ratio.'
    pt: 'Definição da versão 3.6.0, mantida para comparação: a média simples dos rácios dos edifícios, não um rácio
      do distrito.'
  - names: energy_grid_ratio_to_business_as_usual_{import,export,net_exchange}_total_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Control total over BAU total; signed ratio for net exchange.
    pt: Total do controlo sobre o total BAU; rácio com sinal para a troca líquida.
  - names: energy_grid_shape_quality_peak_{daily,all_time}_average_to_baseline_ratio
    levels:
    - district
    unit: ratio
    en: Control peak over baseline peak, where a peak is the mean over daily windows (or the single episode window)
      of the maximum signed net district power.
    pt: Pico do controlo sobre o pico do contrafactual, sendo o pico a média, sobre janelas diárias (ou a janela
      única do episódio), do máximo da potência líquida com sinal do distrito.
  - names: energy_grid_shape_quality_peak_{daily,all_time}_average_{control,business_as_usual,delta_to_business_as_usual}_kw
    levels:
    - district
    unit: kW
    en: Peak of the signed net district power in the controlled run, in the BAU run, and control minus BAU.
    pt: Pico da potência líquida com sinal do distrito na execução controlada, na execução BAU, e controlo menos
      BAU.
  - names: energy_grid_shape_quality_peak_{daily,all_time}_average_to_business_as_usual_ratio
    levels:
    - district
    unit: ratio
    en: Control peak over BAU peak, on signed net district power.
    pt: Pico do controlo sobre o pico BAU, na potência líquida com sinal do distrito.
  - names: energy_grid_shape_quality_ramping_average_to_baseline_ratio
    levels:
    - district
    unit: ratio
    en: Summed upward ramps of the control district net series over those of the baseline (a ratio of totals, kept
      from 3.6.0).
    pt: Soma das rampas ascendentes da série líquida do distrito no controlo sobre a do contrafactual (um rácio
      de totais, mantido da versão 3.6.0).
  - names: energy_grid_shape_quality_ramping_{average,total}_{control,business_as_usual,delta_to_business_as_usual}_kw
    levels:
    - district
    unit: kW
    en: 'Upward ramping of the district net power in the controlled run, in the BAU run, and control minus BAU:
      `average` per step transition, `total` summed over the episode (3.6.0 value).'
    pt: 'Rampa ascendente da potência líquida do distrito na execução controlada, na execução BAU, e controlo menos
      BAU: `average` por transição entre passos, `total` somada no episódio (valor da versão 3.6.0).'
  - names: energy_grid_shape_quality_ramping_average_to_business_as_usual_ratio
    levels:
    - district
    unit: ratio
    en: Control mean upward ramp over BAU mean upward ramp; `ramping_total` has no ratio row.
    pt: Rampa ascendente média do controlo sobre a da execução BAU; `ramping_total` não tem linha de rácio.
  - names: energy_grid_shape_quality_load_factor_penalty_{daily,monthly}_average_to_baseline_ratio
    levels:
    - district
    unit: ratio
    en: Control load-factor penalty over baseline penalty, on district import power and daily (24 h) or monthly
      (730 h) windows.
    pt: Penalização do fator de carga do controlo sobre a do contrafactual, na potência de importação do distrito
      e em janelas diárias (24 h) ou mensais (730 h).
  - names: energy_grid_shape_quality_load_factor_penalty_{daily,monthly}_average_to_baseline_signed_net_ratio
    levels:
    - district
    unit: ratio
    en: As the import ratio above, on the signed net series (3.6.0 definition).
    pt: Como o rácio de importação acima, na série líquida com sinal (definição da versão 3.6.0).
  - names: energy_grid_shape_quality_load_factor_penalty_{daily,monthly}_average{,_signed_net}_{control,business_as_usual,delta_to_business_as_usual}_ratio
    levels:
    - district
    unit: ratio
    en: Load-factor penalty of the controlled run, of the BAU run, and control minus BAU, on import power or, with
      `_signed_net`, on signed net power (3.6.0).
    pt: Penalização do fator de carga da execução controlada, da execução BAU, e controlo menos BAU, na potência
      de importação ou, com `_signed_net`, na potência líquida com sinal (3.6.0).
  - names: energy_grid_shape_quality_load_factor_penalty_{daily,monthly}_average{,_signed_net}_to_business_as_usual_ratio
    levels:
    - district
    unit: ratio
    en: Control load-factor penalty over BAU penalty, on the same series.
    pt: Penalização do fator de carga do controlo sobre a da execução BAU, na mesma série.
  - names: energy_grid_window_average_power_{control,business_as_usual,delta_to_business_as_usual}_kw
    levels:
    - building
    - district
    unit: kW
    en: Mean signed net grid power inside the recurring local `evaluation_window` for the controlled run, the BAU
      run, and control minus BAU; emitted only when `evaluation_window.enabled` is true.
    pt: Potência líquida média com sinal na rede dentro da janela local recorrente `evaluation_window` na execução
      controlada, na execução BAU, e controlo menos BAU; só é emitida quando `evaluation_window.enabled` é
      verdadeiro.
- id: emissions
  title:
    en: Emissions
    pt: Emissões
  intro:
    en: Carbon emissions of the electricity imported from the grid by each member and by the district; the rows
      appear in every run.
    pt: Emissões de carbono da eletricidade importada da rede por cada membro e pelo distrito; as linhas aparecem
      em todas as execuções.
  kpis:
  - names: emissions_{total,daily_average}_{control,baseline,delta}_kgco2
    levels:
    - building
    - district
    unit: kgCO2
    en: Emissions of grid import for the controlled run, the conventional counterfactual and control minus baseline;
      the district value is that of the netted district import, not the sum of the buildings.
    pt: Emissões da importação da rede na execução controlada, no contrafactual convencional e controlo menos contrafactual;
      o valor do distrito é o da importação compensada do distrito, não a soma dos edifícios.
  - names: emissions_total_{control,baseline,business_as_usual}_member_sum_kgco2
    levels:
    - district
    unit: kgCO2
    en: '3.6.0 district definition kept for comparison: the sum of the members'' own emissions in the control, baseline
      or BAU run.'
    pt: 'Definição do distrito da versão 3.6.0, mantida para comparação: a soma das emissões próprias dos membros
      na execução controlada, no contrafactual ou na execução BAU.'
  - names: emissions_ratio_to_baseline_total_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Control emissions total over baseline emissions total; the district ratio divides the netted district totals.
    pt: Total de emissões do controlo sobre o do contrafactual; o rácio do distrito divide os totais compensados
      do distrito.
  - names: emissions_ratio_to_baseline_total_building_mean_ratio
    levels:
    - district
    unit: ratio
    en: '3.6.0 definition kept for comparison: the unweighted mean of the building ratios.'
    pt: 'Definição da versão 3.6.0, mantida para comparação: a média simples dos rácios dos edifícios.'
  - names: emissions_{total,daily_average}_{business_as_usual,delta_to_business_as_usual}_kgco2
    levels:
    - building
    - district
    unit: kgCO2
    en: Emissions of grid import; `_business_as_usual` and `_delta_to_business_as_usual` as in the shared rules.
    pt: Emissões da importação da rede; `_business_as_usual` e `_delta_to_business_as_usual` como nas regras comuns.
  - names: emissions_ratio_to_business_as_usual_total_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Control emissions total over BAU emissions total.
    pt: Total de emissões do controlo sobre o total BAU.
- id: solar_self_consumption
  title:
    en: Solar self-consumption
    pt: Autoconsumo solar
  intro:
    en: PV generation and how much of it is used inside each member or the district rather than exported or curtailed;
      the rows appear in every run and are zero or undefined without PV.
    pt: Produção fotovoltaica (FV) e quanto dela é usado dentro de cada membro ou do distrito em vez de ser exportado
      ou cortado; as linhas aparecem em todas as execuções e são nulas ou indefinidas sem FV.
  kpis:
  - names: solar_self_consumption_{total,daily_average}_{generation,export}{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Available PV generation and PV-backed export to the grid, as a total or daily average; `_business_as_usual`
      and `_delta_to_business_as_usual` as in the shared rules.
    pt: Produção FV disponível e exportação para a rede suportada por FV, como total ou média diária; `_business_as_usual`
      e `_delta_to_business_as_usual` como nas regras comuns.
  - names: solar_self_consumption_total_curtailment_kwh
    levels:
    - building
    - district
    unit: kWh
    en: PV energy that could not be used while the member was islanded by a power outage; zero outside outages.
      No BAU row.
    pt: Energia FV que não pôde ser usada enquanto o membro esteve isolado por um corte de energia; nula fora dos
      cortes. Sem linha BAU.
  - names: solar_self_consumption_ratio_self_consumption{,_business_as_usual,_delta_to_business_as_usual}_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Share of PV generation used locally, (generation − export − curtailment) / generation, undefined without
      generation; `_business_as_usual` and `_delta_to_business_as_usual` as in the shared rules.
    pt: Fração da produção FV usada localmente, (produção − exportação − corte) / produção, indefinida sem produção;
      `_business_as_usual` e `_delta_to_business_as_usual` como nas regras comuns.
  - names: solar_self_consumption_ratio_to_business_as_usual_{generation_total,export_total,self_consumption}_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Control value over BAU value of total generation, total export or the self-consumption ratio.
    pt: Valor do controlo sobre o valor BAU da produção total, da exportação total ou do rácio de autoconsumo.
- id: community_market
  title:
    en: Community market
    pt: Mercado comunitário
  intro:
    en: Local energy trading between the members of a community and its settlement. The rows appear in every run
      (zero, or undefined shares, when `community_market.enabled` is false), except `local_traded` and `import_share`,
      which need the market and their KPI switches.
    pt: Troca local de energia entre os membros de uma comunidade e a respetiva liquidação. As linhas aparecem em
      todas as simulações (a zero, ou com quotas indefinidas, quando `community_market.enabled` é falso), exceto
      `local_traded` e `import_share`, que exigem o mercado e os respetivos interruptores de KPI.
  kpis:
  - names: energy_grid_community_market_local_{import,export}_{total,daily_average}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Energy bought from (import) or sold to (export) other members through local trading, summed over the executed
      steps; daily averages as in the shared rules.
    pt: Energia comprada a (importação) ou vendida a (exportação) outros membros através da troca local, somada
      nos passos executados; médias diárias como nas regras comuns.
  - names: energy_grid_community_market_grid_{import,export}_after_local_{total,daily_average}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Each member's grid import still needed, or surplus still exported to the grid, after local trading, summed
      over members without further netting; daily averages as in the shared rules.
    pt: Importação da rede ainda necessária, ou excedente ainda exportado para a rede, de cada membro depois da
      troca local, somada pelos membros sem nova compensação; médias diárias como nas regras comuns.
  - names: energy_grid_community_market_local_traded_{total,daily_average}_kwh
    levels:
    - district
    unit: kWh
    en: Energy traded locally; equal to the district local import. Emitted only when the market is enabled and `community_market.kpis.community_local_traded_enabled`
      is true.
    pt: Energia trocada localmente; igual à importação local do distrito. Só é emitida com o mercado ativo e `community_market.kpis.community_local_traded_enabled`
      verdadeiro.
  - names: cost_community_market_settled_{total,daily_average}_eur
    levels:
    - building
    - district
    unit: EUR
    en: 'Cost after local settlement: grid import and local purchases minus local sales and grid export revenue;
      can be negative.'
    pt: 'Custo depois da liquidação local: importação da rede e compras locais menos vendas locais e receita de
      exportação para a rede; pode ser negativo.'
  - names: cost_community_market_counterfactual_{total,daily_average}_eur
    levels:
    - building
    - district
    unit: EUR
    en: Grid-only cost of the same controlled flows without local trading, `import · grid import price − export
      · grid export price`; not the `baseline` evaluation condition.
    pt: Custo só com a rede dos mesmos fluxos controlados sem troca local, `importação · preço de importação − exportação
      · preço de exportação`; não é a condição de avaliação `baseline`.
  - names: cost_community_market_savings_{total,daily_average}_eur
    levels:
    - building
    - district
    unit: EUR
    en: Counterfactual cost minus settled cost; positive when local trading lowered the cost.
    pt: Custo contrafactual menos custo liquidado; positivo quando a troca local baixou o custo.
  - names: cost_community_market_operator_balance_total_eur
    levels:
    - district
    unit: EUR
    en: 'Money the market keeps (positive) or pays (negative): importers'' local payments minus exporters'' local
      revenue. It is zero when all members share one local price at each step.'
    pt: 'Dinheiro que o mercado retém (positivo) ou paga (negativo): pagamentos locais dos importadores menos receitas
      locais dos exportadores. É zero quando todos os membros têm o mesmo preço local em cada passo.'
  - names: solar_self_consumption_community_market_import_share_ratio
    levels:
    - district
    unit: ratio
    en: 'Canonical local share of demand: `local import / (local import + grid import after local)`, the share of
      the members'' gross import covered by local trading. Emitted only when the market is enabled and `community_market.kpis.community_self_consumption_enabled`
      is true.'
    pt: 'Quota local da procura canónica: `importação local / (importação local + importação da rede depois da troca
      local)`, a parte da importação bruta dos membros coberta pela troca local. Só é emitida com o mercado ativo
      e `community_market.kpis.community_self_consumption_enabled` verdadeiro.'
  - names: solar_self_consumption_community_market_local_share_of_demand_ratio
    levels:
    - building
    - district
    unit: ratio
    en: 'Deprecated alias, kept for compatibility: same formula as `import_share` (emitted in every run, undefined
      only when the denominator is 0). At building level it is the only share of demand.'
    pt: 'Alias obsoleto, mantido por compatibilidade: a mesma fórmula de `import_share` (emitido em todas as simulações,
      indefinido só quando o denominador é 0). Ao nível do edifício é a única quota da procura.'
  - names: solar_self_consumption_community_market_local_share_of_export_ratio
    levels:
    - building
    - district
    unit: ratio
    en: '`local export / (local export + grid export after local)`: the share of the members'' gross export sold
      to other members.'
    pt: '`exportação local / (exportação local + exportação para a rede depois da troca local)`: a parte da exportação
      bruta dos membros vendida a outros membros.'
- id: battery
  title:
    en: Batteries
    pt: Baterias
  intro:
    en: Activity and wear of the stationary batteries; the rows appear in every run, with zero energy and undefined
      cycles and fade for members without a battery.
    pt: Atividade e desgaste das baterias estacionárias; as linhas aparecem em todas as execuções, com energia nula
      e ciclos e perda de capacidade indefinidos para membros sem bateria.
  kpis:
  - names: battery_total_{charge,discharge,throughput}{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Energy charged into and discharged from the batteries at their terminals, and throughput = charge + discharge;
      `_business_as_usual` and `_delta_to_business_as_usual` as in the shared rules.
    pt: Energia carregada e descarregada nos terminais das baterias, e energia movimentada = carga + descarga; `_business_as_usual`
      e `_delta_to_business_as_usual` como nas regras comuns.
  - names: battery_health_equivalent_full_cycles{,_business_as_usual,_delta_to_business_as_usual}_count
    levels:
    - building
    - district
    unit: count
    en: Equivalent full cycles, throughput / (2 · nominal capacity), pooled over capacity at district and
      portfolio levels. `_business_as_usual` and `_delta_to_business_as_usual` as in the shared rules.
    pt: Ciclos completos equivalentes, energia movimentada / (2 · capacidade nominal), agregados pela capacidade
      no distrito e no portefólio. `_business_as_usual` e `_delta_to_business_as_usual` como nas regras comuns.
  - names: battery_health_capacity_fade{,_business_as_usual,_delta_to_business_as_usual}_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Fraction of nominal capacity lost to degradation, (capacity − degraded capacity) / capacity, clipped to
      [0, 1]; `_business_as_usual` and `_delta_to_business_as_usual` as in the shared rules.
    pt: Fração da capacidade nominal perdida por degradação, (capacidade − capacidade degradada) / capacidade, limitada
      a [0, 1]; `_business_as_usual` e `_delta_to_business_as_usual` como nas regras comuns.
  - names: battery_ratio_to_business_as_usual_{charge,discharge,throughput,equivalent_full_cycles,capacity_fade}_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Control value over BAU value of charge, discharge, throughput, equivalent full cycles or capacity fade.
    pt: Valor do controlo sobre o valor BAU da carga, descarga, energia movimentada, ciclos completos equivalentes
      ou perda de capacidade.
- id: electrical_service_phase
  title:
    en: Electrical service and phases
    pt: Serviço elétrico e fases
  intro:
    en: Compliance with the declared total and per-phase power limits of the electrical service, and the balance
      and peaks of the phases; the values are zero or undefined unless the schema configures an electrical service.
    pt: Cumprimento dos limites de potência total e por fase declarados para o serviço elétrico, e o equilíbrio
      e os picos das fases; os valores são nulos ou indefinidos se o esquema não configurar um serviço elétrico.
  kpis:
  - names: electrical_service_phase_violations_energy_total_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Energy of the applied power above the declared total and per-phase import and export limits, after constraint
      handling; excesses up to 1e-5 kW are ignored.
    pt: Energia da potência aplicada acima dos limites declarados de importação e exportação, totais e por fase,
      depois do tratamento das restrições; excessos até 1e-5 kW são ignorados.
  - names: electrical_service_phase_violations_event_count
    levels:
    - building
    - district
    unit: count
    en: Number of time steps with a violation above 1e-9 kWh, summed over buildings at district level.
    pt: Número de passos com violação acima de 1e-9 kWh, somado sobre os edifícios ao nível do distrito.
  - names: electrical_service_phase_requested_pressure_energy_total_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Energy by which the controller's request, before projection onto the limits, would have exceeded them; it
      is not an applied violation.
    pt: Energia em que o pedido do controlador, antes da projeção nos limites, os teria excedido; não é uma violação
      aplicada.
  - names: electrical_service_phase_requested_pressure_event_count
    levels:
    - building
    - district
    unit: count
    en: Number of time steps with requested pressure above 1e-9 kWh, summed over buildings at district level.
    pt: Número de passos com pressão pedida acima de 1e-9 kWh, somado sobre os edifícios ao nível do distrito.
  - names: electrical_service_phase_imbalance_phase_average_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Mean over time steps of (max |P| − min |P|) / mean |P| over the three phases, 0 when mean |P| ≤ 1e-9 kW;
      three-phase buildings only, and the district value is the mean over all building-steps.
    pt: Média sobre os passos de (máx |P| − mín |P|) / média |P| nas três fases, 0 quando média |P| ≤ 1e-9 kW; só
      edifícios trifásicos, e o valor do distrito é a média sobre todos os passos de todos os edifícios.
  - names: electrical_service_phase_phase_peaks_{import,export}_peak_{l1,l2,l3}_kw
    levels:
    - building
    - district
    unit: kW
    en: Highest import or export power on each phase; the district value is the peak of the summed phase power of
      its members.
    pt: Maior potência de importação ou de exportação em cada fase; o valor do distrito é o pico da soma da potência
      dessa fase dos membros.
- id: ev
  title:
    en: Electric vehicles
    pt: Veículos elétricos
  intro:
    en: Departure service, charging and V2G energy of electric vehicles at the members' chargers. Every member emits
      these rows; without chargers, counts and energies are 0 and rates are undefined.
    pt: Serviço à partida, energia de carregamento e V2G dos veículos elétricos (VE) nos carregadores dos membros.
      Todos os membros emitem estas linhas; sem carregadores, as contagens e energias são 0 e as taxas ficam indefinidas.
  kpis:
  - names: ev_events_departure_count
    levels:
    - building
    - district
    unit: count
    en: Departures with a connected EV and battery, a valid target SOC and a finite departure SOC; the denominator
      of the `ev_performance` rates and means.
    pt: Partidas com VE e bateria ligados, SOC alvo válido e SOC finito à partida; é o denominador das taxas e médias
      `ev_performance`.
  - names: ev_events_departure_{met,min_acceptable,within_tolerance}_count
    levels:
    - building
    - district
    unit: count
    en: Counted departures whose SOC met the target, the minimum acceptable SOC (target minus the service tolerance)
      or the symmetric tolerance band around the target.
    pt: Partidas contadas cujo SOC cumpriu o alvo, o SOC mínimo aceitável (alvo menos a tolerância de serviço) ou
      a banda simétrica de tolerância em torno do alvo.
  - names: ev_events_departure_{target,min_acceptable,within_tolerance}_{feasible,infeasible}_count
    levels:
    - building
    - district
    unit: count
    en: Counted departures whose threshold was or was not reachable by charging at maximum power during the connection;
      legacy rule, in which missing data counts as feasible, so feasible + infeasible equals the departure count.
    pt: Partidas contadas cujo limiar era ou não alcançável carregando à potência máxima durante a ligação; regra
      antiga, em que dados em falta contam como viáveis, pelo que viáveis + inviáveis igualam o número de partidas.
  - names: ev_performance_departure_{success,min_acceptable,within_tolerance}_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Share of counted departures that met the target, the minimum acceptable SOC or the tolerance band; undefined
      without departures.
    pt: Fração das partidas contadas que cumpriram o alvo, o SOC mínimo aceitável ou a banda de tolerância; indefinida
      sem partidas.
  - names: ev_performance_departure_{success,min_acceptable,within_tolerance}_feasible_ratio
    levels:
    - building
    - district
    unit: ratio
    en: The same share over the departures feasible for that threshold under the legacy rule; undefined when none
      is feasible.
    pt: A mesma fração sobre as partidas viáveis para esse limiar segundo a regra antiga; indefinida quando nenhuma
      é viável.
  - names: ev_performance_departure_{soc_deficit,shortfall_beyond_tolerance,soc_surplus,soc_absolute_error}_mean_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Mean over counted departures, in SOC fraction, of max(target − SOC, 0), max(target − tolerance − SOC, 0),
      max(SOC − target, 0) or |SOC − target|; undefined without departures.
    pt: Média sobre as partidas contadas, em fração de SOC, de max(alvo − SOC, 0), max(alvo − tolerância − SOC,
      0), max(SOC − alvo, 0) ou |SOC − alvo|; indefinida sem partidas.
  - names: ev_performance_departure_tolerance_ratio
    levels:
    - building
    - district
    unit: ratio
    en: 'Configuration echo: the `ev_departure_service_tolerance` setting (default 0.05), not a measurement.'
    pt: 'Eco da configuração: o parâmetro `ev_departure_service_tolerance` (por omissão 0,05), não uma medição.'
  - names: ev_total_charge{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Gross AC energy drawn by the chargers to charge EVs, including charger losses; `_business_as_usual` and
      `_delta_to_business_as_usual` as in the shared rules.
    pt: Energia AC bruta absorvida pelos carregadores para carregar os VE, incluindo as perdas do carregador; `_business_as_usual`
      e `_delta_to_business_as_usual` conforme as regras comuns.
  - names: ev_total_v2g_export{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Gross AC energy delivered by the chargers from EV discharge, after charger losses; not grid export. `_business_as_usual`
      and `_delta_to_business_as_usual` as in the shared rules.
    pt: Energia AC bruta fornecida pelos carregadores a partir da descarga dos VE, após as perdas do carregador;
      não é exportação para a rede. `_business_as_usual` e `_delta_to_business_as_usual` conforme as regras comuns.
  - names: ev_ratio_to_business_as_usual_{charge,v2g_export}_total_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Control over BAU charge or V2G total, as in the shared rules; because the BAU never uses V2G, the V2G ratio
      is undefined whenever the controller discharges.
    pt: Total de carga ou de V2G do controlo sobre o do BAU, conforme as regras comuns; como o BAU nunca usa V2G,
      o ratio V2G fica indefinido sempre que o controlador descarrega.
  - names: ev_energy_accounting_connected_soc_gain_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Sum over counted departures of max(departure SOC − arrival SOC, 0) times the nominal battery capacity.
    pt: Soma, sobre as partidas contadas, de max(SOC à partida − SOC à chegada, 0) vezes a capacidade nominal da
      bateria.
  - names: ev_energy_accounting_shortfall_kwh
    levels:
    - building
    - district
    unit: kWh
    en: 'Per member, max(SOC gain − charge total, 0): SOC gain not explained by metered charging; the district value
      is the sum of the member values.'
    pt: 'Por membro, max(ganho de SOC − total de carga, 0): ganho de SOC não explicado pela carga medida; o valor
      do distrito é a soma dos valores dos membros.'
  - names: ev_window_net_exchange_control_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Signed net AC energy across EV chargers inside the recurring local `evaluation_window` (positive for
      charging draw, negative for V2X delivery); emitted only when `evaluation_window.enabled` is true.
    pt: Energia AC líquida com sinal nos carregadores de VE dentro da janela local recorrente `evaluation_window`
      (positiva no carregamento, negativa na entrega V2X); só é emitida quando `evaluation_window.enabled` é
      verdadeiro.
- id: ev_departure_audit
  title:
    en: EV departure audit
    pt: Auditoria das partidas dos VE
  intro:
    en: Audited EV departure service, with an explicit population, a three-way feasibility status and the reason
      for each unknown case. Every member emits these rows.
    pt: Serviço auditado às partidas dos VE, com uma população explícita, um estado de viabilidade com três classes
      e o motivo de cada caso desconhecido. Todos os membros emitem estas linhas.
  kpis:
  - names: ev_departure_audit_departures_count
    levels:
    - building
    - district
    unit: count
    en: Every detected departure at a charger active at that step, whether or not its EV, target or SOC is known.
    pt: Todas as partidas detetadas num carregador ativo nesse passo, sejam ou não conhecidos o VE, o alvo ou o
      SOC.
  - names: ev_departure_audit_service_{observed,unknown}_count
    levels:
    - building
    - district
    unit: count
    en: Departures whose service was observed (a valid target and a departure SOC in [0, 1]) or not; the two sum
      to the departure count.
    pt: Partidas cujo serviço foi observado (alvo válido e SOC à partida em [0, 1]) ou não; as duas somam o número
      de partidas.
  - names: ev_departure_audit_service_coverage_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Observed departures over all departures; undefined without departures.
    pt: Partidas observadas sobre todas as partidas; indefinido sem partidas.
  - names: ev_departure_audit_{target,min_acceptable,within_tolerance}_{feasible,infeasible,unknown}_count
    levels:
    - building
    - district
    unit: count
    en: Departures whose threshold was reachable, not reachable, or could not be judged by the audit replay; the
      three sum to the departure count.
    pt: Partidas cujo limiar era alcançável, não alcançável, ou não pôde ser avaliado pela simulação da auditoria;
      as três somam o número de partidas.
  - names: ev_departure_audit_{target,min_acceptable,within_tolerance}_unknown_{missing_target,missing_ev,missing_battery,invalid_capacity,invalid_charger_power,invalid_charger_efficiency,invalid_time_step,missing_arrival_soc,unsupported_battery_model,invalid_battery_parameters,outage_supply_not_replayed}_count
    levels:
    - building
    - district
    unit: count
    en: Unknown departures by their first applicable reason; the reasons sum to the threshold's unknown count.
    pt: Partidas desconhecidas pelo primeiro motivo aplicável; os motivos somam o número de desconhecidas do limiar.
  - names: ev_departure_audit_{target,min_acceptable,within_tolerance}_service_met_count
    levels:
    - building
    - district
    unit: count
    en: Observed departures that met the threshold, whatever their feasibility.
    pt: Partidas observadas que cumpriram o limiar, independentemente da viabilidade.
  - names: ev_departure_audit_{target,min_acceptable,within_tolerance}_feasible_service_{observed,met}_count
    levels:
    - building
    - district
    unit: count
    en: Feasible departures whose service was observed, and those of them that met the threshold.
    pt: Partidas viáveis cujo serviço foi observado, e as que entre elas cumpriram o limiar.
  - names: ev_departure_audit_{target,min_acceptable,within_tolerance}_coverage_ratio
    levels:
    - building
    - district
    unit: ratio
    en: '(Feasible + infeasible) over all departures: the share whose feasibility is known; undefined without departures.'
    pt: '(Viáveis + inviáveis) sobre todas as partidas: a fração cuja viabilidade é conhecida; indefinido sem partidas.'
  - names: ev_departure_audit_{target,min_acceptable,within_tolerance}_service_observed_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Departures that met the threshold over observed departures, feasible or not; undefined without observed
      departures.
    pt: Partidas que cumpriram o limiar sobre as partidas observadas, viáveis ou não; indefinido sem partidas observadas.
  - names: ev_departure_audit_{target,min_acceptable,within_tolerance}_service_feasible_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Feasible observed departures that met the threshold over feasible observed departures; the canonical controller-comparison
      ratio, undefined when the denominator is 0.
    pt: Partidas viáveis e observadas que cumpriram o limiar sobre as partidas viáveis e observadas; é o ratio canónico
      para comparar controladores, indefinido quando o denominador é 0.
- id: deferrable_appliance
  title:
    en: Flexible appliances
    pt: Equipamentos flexíveis
  intro:
    en: Cycle service of deferrable (flexible) appliances from their cycle states and nominal cycle energies. Every
      member emits these rows; without appliances, counts and energies are 0 and rates are undefined.
    pt: Serviço dos ciclos dos equipamentos flexíveis (diferíveis) a partir dos estados dos ciclos e das energias
      nominais dos ciclos. Todos os membros emitem estas linhas; sem equipamentos, as contagens e energias são 0
      e as taxas ficam indefinidas.
  kpis:
  - names: deferrable_appliance_service_completed_cycles{,_business_as_usual,_delta_to_business_as_usual}_count
    levels:
    - building
    - district
    unit: count
    en: Cycles that ran their full profile; `_business_as_usual` and `_delta_to_business_as_usual` as in the shared
      rules.
    pt: Ciclos que executaram o perfil completo; `_business_as_usual` e `_delta_to_business_as_usual` conforme as
      regras comuns.
  - names: deferrable_appliance_service_missed_cycles{,_business_as_usual,_delta_to_business_as_usual}_count
    levels:
    - building
    - district
    unit: count
    en: Cycles not started by their latest start step, plus running cycles interrupted by a power outage; BAU variants
      as in the shared rules.
    pt: Ciclos não iniciados até ao último passo de arranque, mais os ciclos em curso interrompidos por um corte
      de energia; variantes BAU conforme as regras comuns.
  - names: deferrable_appliance_service_service_level{,_business_as_usual,_delta_to_business_as_usual}_ratio
    levels:
    - building
    - district
    unit: ratio
    en: completed / (completed + missed), undefined when both are 0; the delta is undefined when either side is.
    pt: concluídos / (concluídos + falhados), indefinido quando ambos são 0; o delta fica indefinido quando um dos
      lados o está.
  - names: deferrable_appliance_service_served_energy_total{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Nominal energy of the completed cycles, from their requested profiles, not metered; BAU variants as in the
      shared rules.
    pt: Energia nominal dos ciclos concluídos, a partir dos perfis pedidos, não medida; variantes BAU conforme as
      regras comuns.
  - names: deferrable_appliance_service_unserved_energy_total{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Full nominal energy of the missed cycles, including any part consumed before an interruption; BAU variants
      as in the shared rules.
    pt: Energia nominal completa dos ciclos falhados, incluindo a parte consumida antes de uma interrupção; variantes
      BAU conforme as regras comuns.
  - names: deferrable_appliance_service_average_start_delay{,_business_as_usual,_delta_to_business_as_usual}_hours
    levels:
    - building
    - district
    unit: hours
    en: Mean over completed cycles of (start − earliest start) in hours; undefined when no cycle completed.
    pt: Média, sobre os ciclos concluídos, de (arranque − arranque mais cedo) em horas; indefinida quando nenhum
      ciclo foi concluído.
  - names: deferrable_appliance_ratio_to_business_as_usual_{completed_cycles,missed_cycles,service_level,served_energy_total,unserved_energy_total,average_start_delay}_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Control over BAU value; undefined when its own two totals are zero, even when cycles were due (#305), and
      when the BAU value is zero or either value is undefined.
    pt: Valor do controlo sobre o do BAU; indefinido quando os seus próprios dois totais são zero, mesmo que houvesse
      ciclos devidos (#305), e quando o valor BAU é zero ou um dos valores é indefinido.
- id: deferrable_appliance_audit
  title:
    en: Flexible-appliance audit
    pt: Auditoria dos equipamentos flexíveis
  intro:
    en: Audited cycle service of flexible appliances from metered energy in executed intervals, with an explicit
      population and exclusive states. Every member emits these rows.
    pt: Serviço auditado dos ciclos dos equipamentos flexíveis a partir da energia medida nos intervalos executados,
      com uma população explícita e estados exclusivos. Todos os membros emitem estas linhas.
  kpis:
  - names: deferrable_appliance_audit_{catalogue,offered,excluded}_count
    levels:
    - building
    - district
    unit: count
    en: Cycle requests in the catalogue, those included in the audited population (offered), and the rest (excluded
      = catalogue − offered).
    pt: Pedidos de ciclo no catálogo, os incluídos na população auditada (oferecidos) e os restantes (excluídos
      = catálogo − oferecidos).
  - names: deferrable_appliance_audit_duplicate_offered_count
    levels:
    - building
    - district
    unit: count
    en: Offered requests seen again on a later instance of the same appliance, for example after a reinstall; only
      the first is kept.
    pt: Pedidos oferecidos que voltam a surgir numa instância posterior do mesmo equipamento, por exemplo após uma
      reinstalação; só o primeiro é mantido.
  - names: deferrable_appliance_audit_{pending,running,completed,missed,cancelled}_count
    levels:
    - building
    - district
    unit: count
    en: Offered requests by exclusive final state.
    pt: Pedidos oferecidos por estado final exclusivo.
  - names: deferrable_appliance_audit_resolved_count
    levels:
    - building
    - district
    unit: count
    en: completed + missed + cancelled.
    pt: concluídos + falhados + cancelados.
  - names: deferrable_appliance_audit_excluded_{expired_before_episode,expired_before_activation,not_yet_available,removed_before_available,outside_episode_service_horizon,already_accounted_previous_instance}_count
    levels:
    - building
    - district
    unit: count
    en: Excluded requests by their first applicable exclusion reason; the reasons sum to the excluded count.
    pt: Pedidos excluídos pelo primeiro motivo de exclusão aplicável; os motivos somam o número de excluídos.
  - names: deferrable_appliance_audit_reason_{profile_delivered,profile_energy_shortfall,start_window_elapsed,asset_removed,member_removed,window_open,profile_in_progress}_count
    levels:
    - building
    - district
    unit: count
    en: Offered requests by the reason for their state.
    pt: Pedidos oferecidos pelo motivo do seu estado.
  - names: deferrable_appliance_audit_{requested,served,final_unserved,outstanding}_energy_kwh
    levels:
    - building
    - district
    unit: kWh
    en: 'Over offered requests: requested energy, metered energy attributed to the cycles, the remainder of missed
      and cancelled requests, and the remainder of pending and running ones.'
    pt: 'Sobre os pedidos oferecidos: energia pedida, energia medida atribuída aos ciclos, o remanescente dos pedidos
      falhados e cancelados, e o remanescente dos pendentes e em curso.'
  - names: deferrable_appliance_audit_excluded_requested_energy_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Requested energy of the excluded requests.
    pt: Energia pedida dos pedidos excluídos.
  - names: deferrable_appliance_audit_physical_energy_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Metered appliance energy in all executed intervals, before attribution to cycles.
    pt: Energia medida dos equipamentos em todos os intervalos executados, antes da atribuição aos ciclos.
  - names: deferrable_appliance_audit_physical_balance_residual_kwh
    levels:
    - building
    - district
    unit: kWh
    en: 'Physical energy − served energy: metered energy that no offered request accounts for.'
    pt: 'Energia física − energia servida: energia medida que nenhum pedido oferecido explica.'
  - names: deferrable_appliance_audit_service_balance_residual_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Requested − served − final unserved − outstanding; about 0 by construction, a consistency check.
    pt: Pedida − servida − não servida final − em aberto; cerca de 0 por construção, é uma verificação de consistência.
  - names: deferrable_appliance_audit_observed_completion_ratio
    levels:
    - building
    - district
    unit: ratio
    en: completed / offered; undefined when nothing was offered.
    pt: concluídos / oferecidos; indefinido quando nada foi oferecido.
  - names: deferrable_appliance_audit_resolved_completion_ratio
    levels:
    - building
    - district
    unit: ratio
    en: completed / resolved; undefined when nothing was resolved.
    pt: concluídos / resolvidos; indefinido quando nada foi resolvido.
  - names: deferrable_appliance_audit_resolved_coverage_ratio
    levels:
    - building
    - district
    unit: ratio
    en: resolved / offered; undefined when nothing was offered.
    pt: resolvidos / oferecidos; indefinido quando nada foi oferecido.
- id: escalator
  title:
    en: Escalators
    pt: Escadas rolantes
  intro:
    en: Passenger service, operating-state changes and electricity use of escalators. Every member emits these rows;
      without escalators, totals are 0 and the service level is undefined.
    pt: Serviço aos passageiros, mudanças de estado de funcionamento e consumo de eletricidade das escadas rolantes.
      Todos os membros emitem estas linhas; sem escadas rolantes, os totais são 0 e o nível de serviço fica indefinido.
  kpis:
  - names: escalator_service_requested_passengers_total_count
    levels:
    - building
    - district
    unit: count
    en: Sum of the expected passenger values over the steps with an applied action.
    pt: Soma dos valores de passageiros esperados nos passos com ação aplicada.
  - names: escalator_service_{served,unserved}_passengers_total_count
    levels:
    - building
    - district
    unit: count
    en: 'Unserved: passengers at steps where service was required but the escalator was in standby or unavailable;
      served: requested − unserved.'
    pt: 'Não servidos: passageiros nos passos em que o serviço era exigido mas a escada estava em standby ou indisponível;
      servidos: pedidos − não servidos.'
  - names: escalator_service_service_level_ratio
    levels:
    - building
    - district
    unit: ratio
    en: served / requested passengers; undefined when none were requested.
    pt: passageiros servidos / pedidos; indefinido quando não houve pedidos.
  - names: escalator_energy_electricity_consumption_total_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Escalator electricity consumption over the steps with an applied action.
    pt: Consumo de eletricidade das escadas rolantes nos passos com ação aplicada.
  - names: escalator_operation_state_changes_count
    levels:
    - building
    - district
    unit: count
    en: Steps at which the applied operating state (standby, slow, normal) changed.
    pt: Passos em que o estado de funcionamento aplicado (standby, lento, normal) mudou.
- id: comfort_resilience
  title:
    en: Comfort and resilience
    pt: Conforto e resiliência
  intro:
    en: Legacy thermal-comfort and outage-resilience rows of each building, always emitted; the district value is
      the plain mean of the building values, and the canonical discomfort KPI is `district_thermal_service_audit_discomfort_ratio`.
    pt: Linhas legadas de conforto térmico e de resiliência a cortes de energia de cada edifício, sempre emitidas;
      o valor do distrito é a média simples dos edifícios, e o KPI de desconforto canónico é `district_thermal_service_audit_discomfort_ratio`.
  kpis:
  - names: comfort_resilience_discomfort_{overall,cold,hot}_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Share of evaluated occupied steps that are too cold (T < T_heat − band), too hot (T > T_cool + band) or
      either (`overall`); undefined when no occupied step is evaluated. The district value is the mean of the building
      values; for controller comparison use `thermal_service_audit_discomfort_ratio`.
    pt: Fração dos passos ocupados avaliados demasiado frios (T < T_heat − banda), demasiado quentes (T > T_cool
      + banda) ou qualquer dos dois (`overall`); indefinida sem passos ocupados avaliados. O valor do distrito é
      a média dos edifícios; para comparar controladores use `thermal_service_audit_discomfort_ratio`.
  - names: comfort_resilience_discomfort_{cold,hot}_delta_{min,max,average}_c
    levels:
    - building
    - district
    unit: degC
    en: Minimum, maximum and mean distance from the set point over the too-cold (T_heat − T) or too-hot (T − T_cool)
      steps; always positive and larger than the band, undefined when there is no such step. The district value
      is the mean of the building values, not a district minimum or maximum.
    pt: Distância mínima, máxima e média ao ponto de consigna nos passos demasiado frios (T_heat − T) ou demasiado
      quentes (T − T_cool); sempre positiva e maior do que a banda, indefinida sem tais passos. O valor do distrito
      é a média dos edifícios, não um mínimo ou máximo do distrito.
  - names: comfort_resilience_resilience_one_minus_thermal_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Overall discomfort ratio restricted to occupied steps during a power outage; undefined when no occupied
      outage step is evaluated. Same value per building as `thermal_service_audit_outage_discomfort_ratio`, but
      a plain mean at district level.
    pt: Razão de desconforto global restrita aos passos ocupados durante um corte de energia; indefinida sem passos
      ocupados em corte avaliados. Igual, por edifício, a `thermal_service_audit_outage_discomfort_ratio`, mas média
      simples no distrito.
  - names: comfort_resilience_resilience_unserved_energy_{outage,annual}_normalized_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Unserved service energy (cooling, heating, DHW and non-shiftable load) over expected service energy, over
      outage steps (`outage`) or all steps (`annual`). Reads 0, not undefined, when the expected energy is zero,
      so the outage variant is 0 in runs without outages.
    pt: Energia de serviço não servida (arrefecimento, aquecimento, AQS e carga não deslocável) sobre a energia
      de serviço esperada, nos passos com corte (`outage`) ou em todos os passos (`annual`). Vale 0, e não indefinido,
      quando a energia esperada é nula; a variante de corte é 0 em corridas sem cortes.
- id: thermal_service_audit
  title:
    en: Thermal-service audit
    pt: Auditoria do serviço térmico
  intro:
    en: Interval counts, hours, energy and ratios that audit thermal comfort and service energy of each building,
      always emitted; the district pools the counts, and `district_thermal_service_audit_discomfort_ratio` is the
      canonical discomfort KPI.
    pt: Contagens de intervalos, horas, energia e razões que auditam o conforto térmico e a energia de serviço de
      cada edifício, sempre emitidas; o distrito soma as contagens, e `district_thermal_service_audit_discomfort_ratio`
      é o KPI de desconforto canónico.
  kpis:
  - names: thermal_service_audit_{executed,known_occupancy,occupied,evaluated_occupied,excluded_occupied}_intervals_count
    levels:
    - building
    - district
    unit: count
    en: Executed intervals; intervals with a known occupant count (finite, ≥ 0); occupied intervals (count > 0);
      occupied intervals with valid temperature, set points and band (evaluated); occupied intervals without them
      (excluded).
    pt: Intervalos executados; intervalos com número de ocupantes conhecido (finito, ≥ 0); intervalos ocupados (número
      > 0); intervalos ocupados com temperatura, pontos de consigna e banda válidos (avaliados); intervalos ocupados
      sem eles (excluídos).
  - names: thermal_service_audit_{discomfort,cold,hot}_intervals_count
    levels:
    - building
    - district
    unit: count
    en: Evaluated occupied intervals that are too cold (T < T_heat − band), too hot (T > T_cool + band) or either.
    pt: Intervalos ocupados avaliados demasiado frios (T < T_heat − banda), demasiado quentes (T > T_cool + banda)
      ou qualquer dos dois.
  - names: thermal_service_audit_{outage,unknown_outage,outage_occupied,evaluated_outage_occupied,outage_discomfort}_intervals_count
    levels:
    - building
    - district
    unit: count
    en: Intervals with a power outage (signal > 0) and with an unknown outage signal, whatever the occupancy; then
      outage intervals that are occupied, occupied and evaluated, and uncomfortable.
    pt: Intervalos com corte de energia (sinal > 0) e com sinal de corte desconhecido, qualquer que seja a ocupação;
      e intervalos de corte ocupados, ocupados e avaliados, e com desconforto.
  - names: thermal_service_audit_energy_evaluated_intervals_count
    levels:
    - building
    - district
    unit: count
    en: Intervals whose expected and served energy are finite and non-negative for all four end uses; the others
      are left out of the service-energy totals.
    pt: Intervalos cuja energia esperada e servida é finita e não negativa nos quatro usos finais; os restantes
      ficam fora dos totais de energia de serviço.
  - names: thermal_service_audit_{occupied,evaluated_occupied,discomfort}_hours
    levels:
    - building
    - district
    unit: hours
    en: The matching interval count times the step length in hours. Not carried to the portfolio.
    pt: A contagem de intervalos correspondente multiplicada pela duração do passo em horas. Não passa ao portefólio.
  - names: thermal_service_audit_{cold,hot}_degree_hours
    levels:
    - building
    - district
    unit: hours
    en: 'Degree-hours (°C·h) of discomfort: the sum over too-cold intervals of (T_heat − T), or over too-hot intervals
      of (T − T_cool), times the step length in hours; measured from the set point, not the band edge. Not carried
      to the portfolio.'
    pt: 'Graus-hora (°C·h) de desconforto: soma nos intervalos demasiado frios de (T_heat − T), ou nos demasiado
      quentes de (T − T_cool), vezes a duração do passo em horas; medidos a partir do ponto de consigna, não do
      limite da banda. Não passam ao portefólio.'
  - names: thermal_service_audit_{expected,served,unserved,outage_expected,outage_unserved}_service_energy_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Expected, served and unserved service energy over the energy-evaluated intervals, and the expected and unserved
      energy during outages; unserved energy is the sum over end uses of max(expected − served, 0).
    pt: Energia de serviço esperada, servida e não servida nos intervalos com energia avaliada, e a energia esperada
      e não servida durante cortes; a não servida é a soma, por uso final, de max(esperada − servida, 0).
  - names: thermal_service_audit_discomfort_ratio
    levels:
    - building
    - district
    unit: ratio
    en: 'Canonical discomfort KPI: discomfort intervals over evaluated occupied intervals, undefined when there
      are none. The district value is the ratio of the summed building counts.'
    pt: 'KPI de desconforto canónico: intervalos com desconforto sobre intervalos ocupados avaliados, indefinido
      quando não os há. O valor do distrito é a razão das contagens somadas dos edifícios.'
  - names: thermal_service_audit_outage_discomfort_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Outage discomfort intervals over evaluated occupied outage intervals; undefined when there are none.
    pt: Intervalos de corte com desconforto sobre intervalos de corte ocupados avaliados; indefinido quando não
      os há.
  - names: thermal_service_audit_{thermal,outage_thermal}_coverage_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Evaluated occupied intervals over occupied intervals, overall or during outages; undefined when there is
      no occupied interval.
    pt: Intervalos ocupados avaliados sobre intervalos ocupados, no total ou durante cortes; indefinido sem intervalos
      ocupados.
  - names: thermal_service_audit_{occupancy,energy}_coverage_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Intervals with known occupancy, or with valid service energy, over executed intervals.
    pt: Intervalos com ocupação conhecida, ou com energia de serviço válida, sobre intervalos executados.
  - names: thermal_service_audit_{unserved,outage_unserved}_service_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Unserved over expected service energy, overall or during outages; undefined, not 0, when the expected energy
      is zero (for example without outages).
    pt: Energia de serviço não servida sobre esperada, no total ou durante cortes; indefinida, e não 0, quando a
      energia esperada é nula (por exemplo sem cortes).
- id: equity
  title:
    en: Equity
    pt: Equidade
  intro:
    en: Relative cost benefit of each building against the conventional baseline and its distribution over the district,
      always emitted; the canonical Gini KPI is `district_equity_audit_positive_benefit_gini_ratio`.
    pt: Benefício relativo de custo de cada edifício face à referência convencional e a sua distribuição no distrito,
      sempre emitidos; o KPI de Gini canónico é `district_equity_audit_positive_benefit_gini_ratio`.
  kpis:
  - names: equity_benefit_relative_percent
    levels:
    - building
    unit: percent
    en: 100 · (B − C) / B, with C and B the building's unclipped cost totals under control and under the conventional
      baseline condition (not BAU), market-settled when the community market is enabled; positive is a saving, undefined
      when B ≤ 0. Building level only.
    pt: 100 · (B − C) / B, sendo C e B os custos totais do edifício, sem truncagem, com controlo e na condição de
      referência convencional (não o BAU), liquidados pelo mercado comunitário quando este está ativo; positivo
      é poupança, indefinido quando B ≤ 0. Só ao nível do edifício.
  - names: equity_distribution_gini_benefit_ratio
    levels:
    - district
    unit: ratio
    en: Gini coefficient of the building benefits clipped at 0; undefined when no building has a defined benefit
      or all clipped benefits are 0. Same value as the canonical `equity_audit_positive_benefit_gini_ratio`.
    pt: Coeficiente de Gini dos benefícios dos edifícios truncados em 0; indefinido sem benefícios definidos ou
      com todos os benefícios truncados nulos. Mesmo valor que o canónico `equity_audit_positive_benefit_gini_ratio`.
  - names: equity_distribution_top20_benefit_ratio
    levels:
    - district
    unit: ratio
    en: Share of the summed clipped benefit held by the ceil(20 %) of buildings with the largest benefit (at least
      one); same undefined rule as the Gini.
    pt: Fração do benefício truncado total detida pelos ceil(20 %) edifícios com maior benefício (pelo menos um);
      mesma regra de indefinição que o Gini.
  - names: equity_distribution_losers_percent
    levels:
    - district
    unit: percent
    en: Percentage of buildings with a defined benefit whose benefit is negative (cost above the baseline).
    pt: Percentagem dos edifícios com benefício definido cujo benefício é negativo (custo acima da referência).
  - names: equity_distribution_bpr_asset_poor_over_rich_ratio
    levels:
    - district
    unit: ratio
    en: Mean clipped benefit of `asset_poor` buildings over that of `asset_rich` buildings; undefined unless every
      building has `equity_group` set to one of these two tags, both groups have a defined benefit and the `asset_rich`
      mean is positive.
    pt: Benefício truncado médio dos edifícios `asset_poor` sobre o dos edifícios `asset_rich`; indefinido salvo
      se todos os edifícios tiverem `equity_group` com uma destas duas etiquetas, ambos os grupos tiverem benefício
      definido e a média `asset_rich` for positiva.
- id: equity_audit
  title:
    en: Equity audit
    pt: Auditoria de equidade
  intro:
    en: District equity rows with their member population, always emitted; `district_equity_audit_positive_benefit_gini_ratio`
      is the canonical Gini KPI.
    pt: Linhas de equidade do distrito com a respetiva população de membros, sempre emitidas; `district_equity_audit_positive_benefit_gini_ratio`
      é o KPI de Gini canónico.
  kpis:
  - names: equity_audit_{population_members,eligible_members,excluded_nonpositive_reference,excluded_unknown_cost}_count
    levels:
    - district
    unit: count
    en: KPI buildings; buildings with finite costs and a positive baseline cost (eligible); buildings excluded for
      a baseline cost ≤ 0; buildings excluded for a non-finite cost total, which the current cost sums never produce,
      so this count is always 0.
    pt: Edifícios do KPI; edifícios com custos finitos e custo de referência positivo (elegíveis); edifícios excluídos
      por custo de referência ≤ 0; edifícios excluídos por custo total não finito, que as somas de custo atuais
      nunca produzem, pelo que esta contagem é sempre 0.
  - names: equity_audit_coverage_ratio
    levels:
    - district
    unit: ratio
    en: Eligible buildings over KPI buildings; undefined when there is no building.
    pt: Edifícios elegíveis sobre edifícios do KPI; indefinido sem edifícios.
  - names: equity_audit_losers_percent
    levels:
    - district
    unit: percent
    en: Percentage of eligible buildings with a negative benefit; same value as `equity_distribution_losers_percent`.
    pt: Percentagem dos edifícios elegíveis com benefício negativo; mesmo valor que `equity_distribution_losers_percent`.
  - names: equity_audit_positive_benefit_gini_ratio
    levels:
    - district
    unit: ratio
    en: 'Canonical Gini KPI: Gini coefficient of the eligible buildings'' benefits clipped at 0; undefined when
      the clipped benefits sum to 0. Report it with the losers percentage and the coverage ratio.'
    pt: 'KPI de Gini canónico: coeficiente de Gini dos benefícios dos edifícios elegíveis truncados em 0; indefinido
      quando a soma dos benefícios truncados é 0. Reportar com a percentagem de perdedores e a razão de cobertura.'
  - names: equity_audit_positive_benefit_top20_ratio
    levels:
    - district
    unit: ratio
    en: Share of the summed clipped benefit held by the ceil(20 %) most-benefiting eligible buildings (at least
      one); same value as `equity_distribution_top20_benefit_ratio`.
    pt: Fração do benefício truncado total detida pelos ceil(20 %) edifícios elegíveis com maior benefício (pelo
      menos um); mesmo valor que `equity_distribution_top20_benefit_ratio`.
- id: demand_response
  title:
    en: Demand response
    pt: Demand response
  intro:
    en: Delivery against dataset demand-response requests, measured from a pre-event baseline, and its settlement;
      the rows appear when `demand_response.enabled` is true.
    pt: Resposta aos pedidos de demand response do dataset, medida face a uma baseline pré-evento, e a respetiva
      liquidação; as linhas aparecem quando `demand_response.enabled` é verdadeiro.
  kpis:
  - names: demand_response_events_count
    levels:
    - building
    - district
    unit: count
    en: Distinct requests with at least one settled step; for a building, the requests active while it was a member.
    pt: Pedidos distintos com pelo menos um passo liquidado; num edifício, os pedidos ativos enquanto era membro.
  - names: demand_response_active_time_step_count
    levels:
    - building
    - district
    unit: count
    en: Executed steps with an active request, including steps with an invalid baseline; for a building, those steps
      at which it was a member.
    pt: Passos executados com um pedido ativo, incluindo passos com baseline inválida; num edifício, os passos em
      que era membro.
  - names: demand_response_invalid_baseline_time_step_count
    levels:
    - building
    - district
    unit: count
    en: Active steps whose pre-event baseline was invalid, which are excluded from delivery and cash.
    pt: Passos ativos cuja baseline pré-evento era inválida, excluídos da entrega e dos valores monetários.
  - names: demand_response_requested_total_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Requested energy, `target power · step hours`, over all active steps; split equally over the active members
      at building level.
    pt: Energia pedida, `potência alvo · horas do passo`, em todos os passos ativos; repartida igualmente pelos
      membros ativos ao nível do edifício.
  - names: demand_response_valid_requested_total_kwh
    levels:
    - district
    unit: kWh
    en: 'Requested energy of the active steps with a valid baseline: the denominator of the compliance ratio.'
    pt: 'Energia pedida nos passos ativos com baseline válida: o denominador da taxa de cumprimento.'
  - names: demand_response_delivered_total_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Signed movement from the baseline in the requested direction, uncapped and without tolerance, over valid
      steps; at building level, the member's own movement.
    pt: Desvio assinado face à baseline na direção pedida, sem limite nem tolerância, nos passos válidos; ao nível
      do edifício, o desvio do próprio membro.
  - names: demand_response_credited_total_kwh
    levels:
    - district
    unit: kWh
    en: 'Delivery credited against the requests: positive delivery capped at the target, without the tolerance;
      the numerator of the compliance ratio.'
    pt: 'Entrega creditada face aos pedidos: entrega positiva limitada ao alvo, sem a tolerância; o numerador da
      taxa de cumprimento.'
  - names: demand_response_shortfall_total_kwh
    levels:
    - building
    - district
    unit: kWh
    en: '`max(target − delivery − tolerance, 0)` energy over valid steps; at building level, the district shortfall
      allocated by penalty weight.'
    pt: Energia `max(alvo − entrega − tolerância, 0)` nos passos válidos; ao nível do edifício, o défice do distrito
      repartido pelo peso de penalização.
  - names: demand_response_compliance_ratio
    levels:
    - building
    - district
    unit: ratio
    en: Credited energy over valid requested energy, clipped to [0, 1]; undefined without valid requested energy.
      At building level, the member's credited share over its equal share of the request.
    pt: Energia creditada sobre a energia pedida válida, limitada a [0, 1]; indefinida sem energia pedida válida.
      Ao nível do edifício, a parte creditada do membro sobre a sua parte igual do pedido.
  - names: demand_response_{revenue,penalty,net_revenue}_total_eur
    levels:
    - building
    - district
    unit: EUR
    en: Revenue (credited energy · activation price), penalty (shortfall · penalty price) and their difference.
    pt: Receita (energia creditada · preço de ativação), penalização (défice · preço de penalização) e a sua diferença.
  - names: demand_response_uncapped_contribution_total_kwh
    levels:
    - building
    unit: kWh
    en: 'Diagnostic: the member''s own positive movement in the requested direction, without tolerance or cap; it
      does not add up to any district value.'
    pt: 'Diagnóstico: o desvio positivo do próprio membro na direção pedida, sem tolerância nem limite; não soma
      para nenhum valor do distrito.'
- id: demand_response_audit
  title:
    en: Demand-response audit
    pt: Auditoria de demand response
  intro:
    en: District demand-response totals, coverage and exclusions split by the declared request purpose (`all`, `service`,
      `stress`, `unspecified`); the rows appear when demand response is enabled, for all four purposes.
    pt: Totais, cobertura e exclusões de demand response do distrito, separados pelo propósito declarado do pedido
      (`all`, `service`, `stress`, `unspecified`); as linhas aparecem quando o demand response está ativo, para
      os quatro propósitos.
  kpis:
  - names: demand_response_audit_{all,service,stress,unspecified}_{requested,valid_requested,delivered,credited,shortfall}_kwh
    levels:
    - district
    unit: kWh
    en: Requested, valid requested, delivered, credited and shortfall energy of the purpose's settled steps, defined
      as in demand response.
    pt: Energia pedida, pedida válida, entregue, creditada e em défice nos passos liquidados do propósito, definidas
      como no demand response.
  - names: demand_response_audit_{all,service,stress,unspecified}_{revenue,penalty,net_revenue}_eur
    levels:
    - district
    unit: EUR
    en: Revenue, penalty and net revenue of the purpose's settled steps.
    pt: Receita, penalização e receita líquida dos passos liquidados do propósito.
  - names: demand_response_audit_{all,service,stress,unspecified}_events_count
    levels:
    - district
    unit: count
    en: Distinct requests of the purpose with at least one settled step.
    pt: Pedidos distintos do propósito com pelo menos um passo liquidado.
  - names: demand_response_audit_{all,service,stress,unspecified}_{active,valid}_intervals_count
    levels:
    - district
    unit: count
    en: Settled steps of the purpose (active), and those with a valid baseline (valid).
    pt: Passos liquidados do propósito (active) e os que têm baseline válida (valid).
  - names: demand_response_audit_{all,service,stress,unspecified}_excluded_{insufficient_history,nonfinite_history,no_members,topology_changed}_intervals_count
    levels:
    - district
    unit: count
    en: Steps of the purpose with an invalid baseline, by reason; the four counts add up to active minus valid steps.
    pt: Passos do propósito com baseline inválida, por motivo; as quatro contagens somam os passos ativos menos
      os válidos.
  - names: demand_response_audit_{all,service,stress,unspecified}_baseline_coverage_ratio
    levels:
    - district
    unit: ratio
    en: Valid steps over active steps; undefined when the purpose has no settled step.
    pt: Passos válidos sobre passos ativos; indefinida quando o propósito não tem passos liquidados.
  - names: demand_response_audit_{all,service,stress,unspecified}_requested_energy_coverage_ratio
    levels:
    - district
    unit: ratio
    en: Valid requested energy over requested energy; undefined when no energy was requested.
    pt: Energia pedida válida sobre energia pedida; indefinida quando não foi pedida energia.
  - names: demand_response_audit_{all,service,stress,unspecified}_compliance_ratio
    levels:
    - district
    unit: ratio
    en: Credited over valid requested energy, clipped to [0, 1]; undefined when valid requested energy is 0.
    pt: Energia creditada sobre energia pedida válida, limitada a [0, 1]; indefinida quando a energia pedida válida
      é 0.
- id: robustness
  title:
    en: Robustness
    pt: Robustez
  intro:
    en: Counters of the observation, forecast, action and asset perturbations applied by dataset robustness events;
      the rows appear when `robustness.enabled` is true.
    pt: Contadores das perturbações de observações, previsões, ações e ativos aplicadas pelos eventos de robustez
      do dataset; as linhas aparecem quando `robustness.enabled` é verdadeiro.
  kpis:
  - names: robustness_events_count
    levels:
    - building
    - district
    unit: count
    en: Distinct robustness events with at least one recorded application (for a building, attributed to it).
    pt: Eventos de robustez distintos com pelo menos uma aplicação registada (num edifício, atribuída a ele).
  - names: robustness_active_time_step_count
    levels:
    - building
    - district
    unit: count
    en: Steps with at least one recorded application, including the terminal observation.
    pt: Passos com pelo menos uma aplicação registada, incluindo a observação terminal.
  - names: robustness_{observation,forecast,action}_corruption_count
    levels:
    - building
    - district
    unit: count
    en: Distinct (event, target) corruptions of observations, forecasts or actions, summed over steps.
    pt: Corrupções distintas (evento, alvo) de observações, previsões ou ações, somadas pelos passos.
  - names: robustness_asset_unavailable_time_step_count
    levels:
    - building
    - district
    unit: count
    en: 'Asset-steps of unavailability: each (event, asset) counts once per step.'
    pt: 'Passos de indisponibilidade de ativos: cada par (evento, ativo) conta uma vez por passo.'
  - names: robustness_missing_observation_count
    levels:
    - building
    - district
    unit: count
    en: Observation or forecast applications in `missing` mode, plus observations hidden by asset events.
    pt: Aplicações a observações ou previsões no modo `missing`, mais as observações ocultadas por eventos de ativos.
  - names: robustness_action_dropout_count
    levels:
    - building
    - district
    unit: count
    en: Action applications in `dropout` mode, plus actions blocked by asset events.
    pt: Aplicações a ações no modo `dropout`, mais as ações bloqueadas por eventos de ativos.
- id: energy_provenance
  title:
    en: Energy provenance
    pt: Proveniência da energia
  intro:
    en: Traces every kWh of electricity from its origin (own or neighbour PV, grid import, or storage inventory
      of unknown origin) to its destination (load, storage, mobility, export, losses and others), with the grid
      carbon it carries; rows appear whenever the environment keeps the provenance ledger (`energy_provenance=True`,
      the default).
    pt: Segue cada kWh de eletricidade desde a origem (produção FV própria ou de vizinhos, importação da rede, ou
      energia armazenada de origem desconhecida) até ao destino (consumo, armazenamento, mobilidade, exportação,
      perdas e outros), com o carbono da rede que transporta; as linhas existem sempre que o ambiente mantém o registo
      de proveniência (`energy_provenance=True`, valor por omissão).
  kpis:
  - names: energy_provenance_pv_generated{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: PV energy produced by the member, including the part later curtailed; `_business_as_usual` and `_delta_to_business_as_usual`
      as in the shared rules.
    pt: Energia FV produzida pelo membro, incluindo a parte depois cortada; `_business_as_usual` e `_delta_to_business_as_usual`
      como nas regras comuns.
  - names: energy_provenance_{pv,grid,unknown}_{load,mobility,grid_export,loss,asset_exit,external_reset,curtailment,stored}{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Energy of origin PV, grid (including grid import of unknown carbon) or unknown that reached the named destination
      in this member, counted by the receiving member; `stored` is the inventory still in the member's storage at
      evaluation, and only PV can be curtailed, so the grid and unknown curtailment rows are always 0. BAU variants
      as in the shared rules.
    pt: Energia de origem FV, rede (incluindo importação de carbono desconhecido) ou desconhecida que chegou ao
      destino indicado neste membro, contada pelo membro que a recebe; `stored` é a energia ainda armazenada no
      membro no momento da avaliação, e só a energia FV pode ser cortada, pelo que as linhas de corte da rede e
      de origem desconhecida valem sempre 0. Variantes BAU como nas regras comuns.
  - names: energy_provenance_pv_load_{direct,after_storage}{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: 'Split of PV reaching the member''s load: `direct` did not pass through storage in that interval, and `after_storage`
      is `max(pv_load - pv_load_direct, 0)`. BAU variants as in the shared rules.'
    pt: 'Divisão da energia FV que chega ao consumo do membro: `direct` não passou por armazenamento nesse intervalo,
      e `after_storage` é `max(pv_load - pv_load_direct, 0)`. Variantes BAU como nas regras comuns.'
  - names: energy_provenance_unknown_input{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: 'Energy that entered the ledger with unknown origin: the opening inventory of each storage when the ledger
      first sees it (including the full stored energy of every EV at connection) and every externally imposed state
      of charge. BAU variants as in the shared rules.'
    pt: 'Energia que entrou no registo com origem desconhecida: o conteúdo inicial de cada armazenamento quando
      o registo o encontra pela primeira vez (incluindo toda a energia de cada VE no momento da ligação) e cada
      estado de carga imposto externamente. Variantes BAU como nas regras comuns.'
  - names: energy_provenance_{,pv_,grid_}{local_import,local_export}{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Energy received from (`local_import`) or sent to (`local_export`) other members in the same interval, in
      total and by origin; these are internal transfers, already counted in the receiving member's destinations.
      BAU variants as in the shared rules.
    pt: Energia recebida de (`local_import`) ou enviada para (`local_export`) outros membros no mesmo intervalo,
      no total e por origem; são transferências internas, já contadas nos destinos do membro que recebe. Variantes
      BAU como nas regras comuns.
  - names: energy_provenance_external_import{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Grid import of the member after local sharing, `max(net, 0) - local_import` summed over intervals, including
      intervals of unknown carbon intensity. BAU variants as in the shared rules.
    pt: Importação da rede do membro após a partilha local, `max(net, 0) - local_import` somado sobre os intervalos,
      incluindo intervalos com intensidade carbónica desconhecida. Variantes BAU como nas regras comuns.
  - names: energy_provenance_external_purchase_emissions{,_business_as_usual,_delta_to_business_as_usual}_kgco2
    levels:
    - building
    - district
    unit: kgCO2
    en: Emissions of the member's grid import after local sharing, at the member's carbon intensity; intervals with
      a non-finite intensity add nothing, and exports earn no credit. BAU variants as in the shared rules.
    pt: Emissões da importação da rede do membro após a partilha local, à intensidade carbónica do membro; intervalos
      com intensidade não finita não somam nada, e as exportações não dão crédito. Variantes BAU como nas regras
      comuns.
  - names: energy_provenance_external_purchase_unknown_carbon{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: Part of `external_import` imported in intervals whose carbon intensity is not finite, and therefore missing
      from the emissions. BAU variants as in the shared rules.
    pt: Parte de `external_import` importada em intervalos cuja intensidade carbónica não é finita, e que por isso
      falta nas emissões. Variantes BAU como nas regras comuns.
  - names: energy_provenance_carbon_{load,mobility,grid_export,loss,asset_exit,external_reset,curtailment,stored}{,_business_as_usual,_delta_to_business_as_usual}_kgco2
    levels:
    - building
    - district
    unit: kgCO2
    en: Grid carbon carried by the energy that reached the named destination in this member; only grid energy carries
      carbon, so `carbon_curtailment` is always 0. BAU variants as in the shared rules.
    pt: Carbono da rede transportado pela energia que chegou ao destino indicado neste membro; só a energia da rede
      transporta carbono, pelo que `carbon_curtailment` vale sempre 0. Variantes BAU como nas regras comuns.
  - names: energy_provenance_carbon_unknown_{load,mobility,grid_export,loss,asset_exit,external_reset,curtailment,stored}{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - building
    - district
    unit: kWh
    en: 'Energy (not carbon) in the named destination whose carbon is unknown: unknown-origin energy plus grid import
      of non-finite intensity; it shows how much energy the matching `carbon_*_kgco2` row leaves uncounted. BAU
      variants as in the shared rules.'
    pt: 'Energia (não carbono) no destino indicado cujo carbono é desconhecido: energia de origem desconhecida mais
      importação da rede com intensidade não finita; mostra quanta energia a linha `carbon_*_kgco2` correspondente
      deixa por contar. Variantes BAU como nas regras comuns.'
  - names: energy_provenance_{pv,grid,unknown}_balance_residual{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - district
    unit: kWh
    en: 'Closure check per origin: input (`pv_generated`, `external_import` or `unknown_input`) minus the sum of
      its eight destinations; expected close to 0. District only, because members exchange energy. BAU variants
      as in the shared rules.'
    pt: 'Verificação de fecho por origem: entrada (`pv_generated`, `external_import` ou `unknown_input`) menos a
      soma dos seus oito destinos; esperado próximo de 0. Só no distrito, porque os membros trocam energia. Variantes
      BAU como nas regras comuns.'
  - names: energy_provenance_carbon_balance_residual{,_business_as_usual,_delta_to_business_as_usual}_kgco2
    levels:
    - district
    unit: kgCO2
    en: 'Carbon closure check: `external_purchase_emissions` minus the sum of the eight `carbon_*` destinations;
      expected close to 0. BAU variants as in the shared rules.'
    pt: 'Verificação de fecho do carbono: `external_purchase_emissions` menos a soma dos oito destinos `carbon_*`;
      esperado próximo de 0. Variantes BAU como nas regras comuns.'
  - names: energy_provenance_pv_useful_{building,with_mobility}{,_business_as_usual,_delta_to_business_as_usual}_ratio
    levels:
    - district
    unit: ratio
    en: Share of district PV generation that reached a building load (`building`), or a building load or a departing
      EV (`with_mobility`); undefined when district PV generation is zero. BAU variants as in the shared rules.
    pt: Fração da produção FV do distrito que chegou a um consumo dos edifícios (`building`), ou a um consumo ou
      a um VE que parte (`with_mobility`); indefinida quando a produção FV do distrito é nula. Variantes BAU como
      nas regras comuns.
  - names: energy_provenance_{bus,storage}_max_residual{,_business_as_usual,_delta_to_business_as_usual}_kwh
    levels:
    - district
    unit: kWh
    en: 'Diagnostics, not measurements of performance: the largest per-interval bus imbalance (`bus`) or gap between
      the ledger''s and the physical stored energy (`storage`) over all members and intervals; expected close to
      0. BAU variants as in the shared rules.'
    pt: 'Diagnósticos, não medidas de desempenho: o maior desequilíbrio de barramento num intervalo (`bus`) ou a
      maior diferença entre a energia armazenada no registo e a física (`storage`), sobre todos os membros e intervalos;
      esperado próximo de 0. Variantes BAU como nas regras comuns.'
- id: topology
  title:
    en: Dynamic topology
    pt: Topologia dinâmica
  intro:
    en: Lifecycle bookkeeping for members of a dynamic topology; the row appears only with `topology_mode='dynamic'`.
    pt: Registo do ciclo de vida dos membros de uma topologia dinâmica; a linha só aparece com `topology_mode='dynamic'`.
  kpis:
  - names: topology_lifecycle_presence
    levels:
    - building
    unit: none
    en: 'Placeholder, always NaN: one row per lifecycle member with no other building row (never active in the episode),
      so its lifecycle columns appear. It has no level prefix because it is added after the KPI naming step.'
    pt: 'Marcador, sempre NaN: uma linha por membro do ciclo de vida sem outra linha de edifício (nunca ativo no
      episódio), para que as suas colunas de ciclo de vida apareçam. Não tem prefixo de nível porque é acrescentada
      depois da etapa de nomeação dos KPI.'
