name: Publish CityLearn to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify installed wheel exports
        run: |
          python -m pip install dist/*.whl
          cd "${{ runner.temp }}"
          python -I "$GITHUB_WORKSPACE/scripts/ci/installed_export_smoke.py" \
            --schema "$GITHUB_WORKSPACE/tests/data/minute_ev_demo/schema.json" \
            --output "${{ runner.temp }}/citylearn-publish-export"

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/citylearn/
    # Trusted publishing (OIDC) needs an ID token. It stays off until the repository variable
    # PYPI_TRUSTED_PUBLISHING is set to 'true' after the publisher is configured on PyPI; until then
    # the twine upload with the existing secrets below is used.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"

      - name: Install publishing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        if: ${{ vars.PYPI_TRUSTED_PUBLISHING == 'true' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          packages-dir: dist/
          verbose: true

      - name: Publish to PyPI (API credentials)
        if: ${{ vars.PYPI_TRUSTED_PUBLISHING != 'true' }}
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: python -m twine upload --verbose dist/*
