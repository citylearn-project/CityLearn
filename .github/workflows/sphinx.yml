name: Sphinx build

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        # Documentation only needs Ubuntu's Pandoc package.
        sudo rm -f \
          /etc/apt/sources.list.d/google-chrome.list \
          /etc/apt/sources.list.d/google-chrome.sources
        sudo apt-get update
        sudo apt-get install -y pandoc
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt -r test_requirements.txt -r docs/requirements.txt
        # autodoc imports citylearn.end_use_load_profiles, whose dependencies are an optional extra.
        python -m pip install -e ".[end_use_load_profiles]"
    - name: Test documentation examples
      run: python -m pytest -q tests/test_documentation_examples.py
    - name: Check the KPI catalogue
      # The catalogue pages are generated from docs/kpi_catalogue.yml, and every emitted KPI must be in it.
      run: |
        python scripts/docs/kpi_catalogue.py --check
        python -m pytest -q tests/test_kpi_catalogue.py
    - name: Execute the example notebooks
      # The notebooks in the repository have no outputs. Run them as the notebooks job of run_tests.yml does and
      # overwrite the sources in this checkout, so the pages show what CI ran. Artifacts cannot be shared between
      # the two workflows without extra permissions, so the notebooks run again here (about one minute).
      run: |
        python -m pip install nbclient nbformat ipykernel "stable-baselines3>=2.4" scikit-learn
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m ipykernel install --user --name python3
        python scripts/ci/run_notebooks.py --output-dir examples
    - name: Build and check HTML
      run: |
        # citylearn.internal is private; docs/source/python_api.rst lists the public modules.
        sphinx-apidoc citylearn citylearn/internal -o docs/source/api -e -M
        sphinx-build -b html docs/source docs/build/html
        python scripts/ci/check_docs.py --require-notebook-outputs docs/build/html
    - name: Save documentation preview
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
      with:
        name: documentation-html
        path: docs/build/html
        retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    environment: github-pages
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
      with:
        name: documentation-html
        path: docs/build/html
    - name: Add CNAME
      env:
        CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
      run: printf '%s\n' "$CUSTOM_DOMAIN" > docs/build/html/CNAME
    - name: Deploy
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/build/html
