name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint (critical rules)
        run: |
          python -m ruff check citylearn tests scripts/manual scripts/ci --select E9,F821,NPY201

  test:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12"]
        numpy: ["2.x"]
        include:
          # Results must stay identical on NumPy 1.x, which the package still supports.
          - python-version: "3.10"
            numpy: "1.x"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-numpy${{ matrix.numpy }}-pip-${{ hashFiles('requirements.txt', 'test_requirements.txt', 'setup.py') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-numpy${{ matrix.numpy }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.numpy }}" = "1.x" ]; then echo "numpy<2" > constraints.txt; else : > constraints.txt; fi
          pip install -c constraints.txt -r requirements.txt
          pip install -c constraints.txt -r test_requirements.txt
          pip install -c constraints.txt -e .
          python -c "import numpy; print('NumPy', numpy.__version__)"

      - name: Run tests
        run: python -m pytest -q --ignore=scripts/manual

      - name: Performance smoke check
        if: matrix.python-version == '3.10' && matrix.numpy == '2.x'
        run: |
          mkdir -p ${{ runner.temp }}/perf
          python scripts/ci/perf_smoke.py \
            --episode-steps 600 \
            --seconds 60 \
            --none-max-ms 30 \
            --end-max-ms 45 \
            --entity-max-ms 50 \
            --ratio-max 2.0 \
            --entity-overhead-ratio-max 3.75 \
            --baseline-file scripts/ci/perf_baseline.json \
            --baseline-regression-ratio 4.5 \
            --baseline-slack-ms 15.0 \
            --metrics-output ${{ runner.temp }}/perf/perf_smoke_report.json

      - name: Upload performance smoke report
        if: always() && matrix.python-version == '3.10' && matrix.numpy == '2.x'
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-report
          path: ${{ runner.temp }}/perf/perf_smoke_report.json
          if-no-files-found: ignore

      - name: Verify installed wheel exports outside the checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir "${{ runner.temp }}/citylearn-wheel"
          python -m pip install --no-deps --force-reinstall "${{ runner.temp }}"/citylearn-wheel/*.whl
          cd "${{ runner.temp }}"
          python -I "$GITHUB_WORKSPACE/scripts/ci/installed_export_smoke.py" \
            --schema "$GITHUB_WORKSPACE/tests/data/minute_ev_demo/schema.json" \
            --output "${{ runner.temp }}/citylearn-installed-export"

  runtime-audits:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install audit dependencies
        run: pip install -r requirements.txt -r test_requirements.txt pyarrow nrel-pysam -e .
      - name: Verify physics, entities, official datasets and fixed-command references
        run: python scripts/audit/run_full_audit.py --strict --output-dir "${{ runner.temp }}/citylearn-audits"
      - name: Upload runtime audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citylearn-runtime-audits
          path: ${{ runner.temp }}/citylearn-audits/*.json
