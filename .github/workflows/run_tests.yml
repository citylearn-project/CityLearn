name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.10"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint (rules from pyproject.toml)
        run: ruff check citylearn tests scripts/manual scripts/ci

  test:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every CPython release with upstream support that the dependencies publish wheels for.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        numpy: ["2.x"]
        include:
          # Results must stay identical on NumPy 1.x, which the package still supports.
          - python-version: "3.10"
            numpy: "1.x"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-numpy${{ matrix.numpy }}-pip-${{ hashFiles('requirements.txt', 'test_requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-numpy${{ matrix.numpy }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.numpy }}" = "1.x" ]; then echo "numpy<2" > constraints.txt; else : > constraints.txt; fi
          pip install -c constraints.txt -r requirements.txt
          pip install -c constraints.txt -r test_requirements.txt
          pip install -c constraints.txt -e .
          # Ray is not a test dependency; one job installs it so that the RLlib wrappers run against Ray too.
          if [ "${{ matrix.python-version }}" = "3.11" ]; then pip install -c constraints.txt "ray[rllib]"; fi
          python -c "import numpy; print('NumPy', numpy.__version__)"

      - name: Run tests
        run: python -m pytest -q --ignore=scripts/manual

      - name: Performance smoke check
        if: matrix.python-version == '3.10' && matrix.numpy == '2.x'
        run: |
          mkdir -p ${{ runner.temp }}/perf
          python scripts/ci/perf_smoke.py \
            --episode-steps 600 \
            --seconds 60 \
            --none-max-ms 30 \
            --end-max-ms 45 \
            --entity-max-ms 50 \
            --ratio-max 2.0 \
            --entity-overhead-ratio-max 3.75 \
            --baseline-file scripts/ci/perf_baseline.json \
            --baseline-regression-ratio 4.5 \
            --baseline-slack-ms 15.0 \
            --metrics-output ${{ runner.temp }}/perf/perf_smoke_report.json

      - name: Upload performance smoke report
        if: always() && matrix.python-version == '3.10' && matrix.numpy == '2.x'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: perf-smoke-report
          path: ${{ runner.temp }}/perf/perf_smoke_report.json
          if-no-files-found: ignore

      - name: Verify installed wheel exports outside the checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir "${{ runner.temp }}/citylearn-wheel"
          python -m pip install --no-deps --force-reinstall "${{ runner.temp }}"/citylearn-wheel/*.whl
          cd "${{ runner.temp }}"
          python -I "$GITHUB_WORKSPACE/scripts/ci/installed_export_smoke.py" \
            --schema "$GITHUB_WORKSPACE/tests/data/minute_ev_demo/schema.json" \
            --output "${{ runner.temp }}/citylearn-installed-export"

  notebooks:
    # The example notebooks published in the documentation, with their install cells skipped. They simulate
    # one week of hourly datasets, so the job stays short; none of them loads the 15 s datasets.
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install CityLearn with the notebook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt "stable-baselines3>=2.4" "ray[rllib]" scikit-learn nbclient nbformat ipykernel -e .
          python -m ipykernel install --user --name python3

      - name: Execute the example notebooks
        run: python scripts/ci/run_notebooks.py

  install-smoke:
    # A plain `pip install` must resolve and run on every platform users report, including
    # Apple Silicon (issue #138). The test job above covers Linux, including the installed wheel.
    needs: lint
    name: install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]  # macos-26 is arm64
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the built wheel with its dependencies from PyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps . --wheel-dir citylearn-wheel
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *glob.glob('citylearn-wheel/*.whl')])"
          python -m pip check
          python -m pip list
          # PyTorch and scikit-learn are optional extras, so the core installation must not pull them in.
          python -c "import importlib.util as u, sys; extra = [m for m in ('torch', 'sklearn') if u.find_spec(m)]; sys.exit(f'core install pulled in {extra}' if extra else 0)"

      - name: Run a simulation and export from the installed package
        working-directory: ${{ runner.temp }}
        shell: bash
        run: >-
          python -I "${{ github.workspace }}/scripts/ci/installed_export_smoke.py"
          --schema "${{ github.workspace }}/tests/data/minute_ev_demo/schema.json"
          --output "${{ runner.temp }}/citylearn-installed-export"

  runtime-audit:
    # One job per audit, in parallel. Each job runs run_full_audit.py in strict mode on its own
    # selection and uploads its own JSON evidence; the runtime-audits job below requires all of them.
    needs: lint
    name: audit (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: physics
            audits: physics
          - name: datasets
            audits: datasets
          - name: entity-contract-and-refactor-parity
            audits: entity_contract refactor_parity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.10'
      - name: Install audit dependencies
        run: pip install -r requirements.txt -r test_requirements.txt pyarrow nrel-pysam -e .
      - name: Verify ${{ matrix.name }}
        run: >-
          python scripts/audit/run_full_audit.py --strict
          --audits ${{ matrix.audits }}
          --output-dir "${{ runner.temp }}/citylearn-audits"
      - name: Upload ${{ matrix.name }} audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: citylearn-runtime-audits-${{ matrix.name }}
          path: ${{ runner.temp }}/citylearn-audits/*.json

  runtime-audits:
    # Single gate for every runtime audit: physics, entity contract, official datasets and
    # refactor parity. It fails unless each audit job above succeeded.
    needs: runtime-audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every runtime audit
        run: |
          echo "runtime-audit result: ${{ needs.runtime-audit.result }}"
          test "${{ needs.runtime-audit.result }}" = "success"
