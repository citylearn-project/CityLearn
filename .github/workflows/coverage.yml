name: Coverage report

# Running the full suite under coverage roughly triples pytest runtime (~16 min vs
# ~5 min without --cov), so coverage is reported weekly and on manual dispatch rather
# than on every pull request or push to master.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.12-numpy2.x-pip-${{ hashFiles('requirements.txt', 'test_requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py3.12-numpy2.x-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test_requirements.txt
          pip install -e .
          python -c "import numpy; print('NumPy', numpy.__version__)"

      - name: Run tests with coverage
        # Reports coverage (terminal summary and coverage.xml); it is not a gate.
        run: python -m pytest -q --ignore=scripts/manual --cov=citylearn --cov-report=term --cov-report=xml:${{ runner.temp }}/coverage/coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage/coverage.xml
          if-no-files-found: ignore
          retention-days: 30
